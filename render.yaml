# One-click deploy on Render (render.com → New → Blueprint → pick this repo).
# The free plan sleeps after 15 minutes idle; the first visit then takes about a minute,
# and Telegram alerts only run while the service is awake. Use a paid plan or a VM for real alerts.
services:
  - type: web
    name: jagapadi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # 1 = serve only the recorded real responses committed in backend/data/replay.
      # Set it when venue internet is doubtful; the app shows each recording's capture time.
      - key: JAGAPADI_OFFLINE
        value: "0"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
